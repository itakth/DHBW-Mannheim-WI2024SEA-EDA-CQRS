services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  producer:
    build: ./producer
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - RABBITMQ_URL=amqp://rabbitmq 
    depends_on:
      rabbitmq:
        condition: service_healthy

  consumer:
    build: ./consumer
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - RABBITMQ_URL=amqp://rabbitmq 
    depends_on:
      rabbitmq:
        condition: service_healthy
  
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html